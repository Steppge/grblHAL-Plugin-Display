; ESP32-S3 N16R8 + MKS TS35 display for grblHAL

[env:display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; console on the USB serial chip (COM6), the native USB port stays free for flashing
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    lovyan03/LovyanGFX@1.2.29
    lvgl/lvgl@9.2.2
    symlink://../esp32common               ; link, WiFi, web interface, map (shared with esp32p4/)
build_src_filter = +<*> -<hwtest.cpp>
extra_scripts = pre:../esp32common/web/build_web.py      ; esp32common/web/index.html -> src/web_index.h

; firmware update over WiFi, the OTA password is read from the environment variable
; GRBLHAL_DISPLAY_OTA (set it once, e.g. setx GRBLHAL_DISPLAY_OTA "..." on Windows)
[env:ota]
extends = env:display
upload_protocol = espota
upload_port = grblhal-display.local
upload_flags = --auth=${sysenv.GRBLHAL_DISPLAY_OTA}

; hardware test: panel ID, color fills, slow SPI
[env:hwtest]
extends = env:display
build_flags =
    ${env:display.build_flags}
    -D TFT_SPI_HZ=4000000
build_src_filter = -<*> +<hwtest.cpp>
