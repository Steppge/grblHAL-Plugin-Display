; Elecrow CrowPanel Advanced 9" ESP32-P4 display for grblHAL (1024x600, EK79007 + GT911)
;
; Only for ESP32-P4 chip revision v1.x: the board esp32-p4-evboard uses the framework libraries
; esp32p4_es (revisions below 3.0). Flash the merged image .pio/build/display/firmware.factory.bin at 0x0.

[env:display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; console on the CH340 at the USB-C port "UART"
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    lvgl/lvgl@9.2.2
    symlink://../esp32common               ; link, WiFi, web interface, map (shared with esp32s3/)
extra_scripts = pre:../esp32common/web/build_web.py      ; esp32common/web/index.html -> src/web_index.h
